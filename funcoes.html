<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capitulo 5 - Funções</title>
</head>
<body>
    <script>
        let nome = prompt("Digite  seu nome:");

        let saudacao = nome => `Olá, ${nome}`;
        console.log(saudacao(nome));

        let valor1 = prompt("Insira o primeiro valor a ser multiplicado:");
        let valor2 = prompt("Insira o segundo valor:");

        function multiplicando(a,b){
           return a*b;
        }

        console.log(multiplicando(valor1,valor2));
    </script>
</body>
</html>
