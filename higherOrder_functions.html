<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 13 - Funções de alta Ordem</title>
</head>
<body>
    <script>
        /*Exercicio 1*/
        function executarDuasVezes(fn) {
            fn();
            fn();
        }

        executarDuasVezes(() => console.log("olá!"));//arrow function
        //saída será 2x "olá!""
        
        /*Exercicio 2*/
        function criarSaudacao(saudacao) {
             return function(nome) {
                return `${saudacao}, ${nome}!`;
             };
        }

        const oi    = criarSaudacao("Oi");
        const bomDia = criarSaudacao("Bom Dia");
        console.log(oi("Sol"));    
        console.log(bomDia("Sol"));  

        /*Exercicio 3*/
        function calcular(a, b, operacao) {
            return operacao(a, b);
        }

        const soma = (a, b) => a + b;
        const mult = (a, b) => a * b;
        const dividir = (a,b) => a/b;
        const subtrair = (a,b) => a-b;

        console.log(calcular(4, 3, soma));  // 7
        console.log(calcular(4, 3, mult));  // 12
        console.log(calcular(2,2,dividir)); //1
        console.log(calcular(5,2,subtrair));//3

        /*Exercicio 4 -- Fiquei com duvida nesse*/

        // compose junta duas funções em uma só.
        // primeiro roda g, depois passa o resultado pra f?

        function compose(f, g) {
            return function(x) {
                return f(g(x));
            };
        }

        
        const deixarMaiusculo = texto => texto.toUpperCase();
        const adicionarExclamacao = texto => texto + "!";

        const gritar = compose(adicionarExclamacao, deixarMaiusculo);

        console.log(gritar("olá")); // "OLÁ!"
    </script>
</body>
</html>
